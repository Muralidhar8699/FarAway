# Netlify build settings (Vercel uses vercel.json).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every route (e.g. /tournaments/abc, /join/CODE) to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
